name: Deploy sajilowork-app

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: "203.134.250.212"
          port: 2025
          username: "evaracy"
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/evaracy/frontend/Sajilowork-frontend
            git pull origin main
            npm install
            npm run build
            pm2 reload sajilowork-app
